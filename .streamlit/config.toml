[theme]
base            = "light"
primaryColor    = "#A6842C"
backgroundColor = "#F7F4EC"
secondaryBackgroundColor = "#FFFFFF"
textColor       = "#1A1D2E"
font            = "sans serif"

[server]
headless        = true
enableCORS      = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
