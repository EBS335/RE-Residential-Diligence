[theme]
base            = "dark"
primaryColor    = "#22D3EE"
backgroundColor = "#0A0E16"
secondaryBackgroundColor = "#121826"
textColor       = "#EDEFF5"
font            = "sans serif"

[server]
headless        = true
enableCORS      = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
